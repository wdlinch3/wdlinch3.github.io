<nav>
  <section>
    <h2>Navigate</h2>
    <ul>
      {% assign global_nav_items = site.data.site_nav | where: "global", true | sort: "priority" %}
      {% for item in global_nav_items %}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </section>
</nav>
